global
    maxconn 256
defaults
    mode tcp
    timeout connect 5s
    timeout client 120s
    timeout server 120s
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
frontend veyra_https
    bind :8443
    default_backend caddy_tls
backend caddy_tls
    server proxy veyra-tls:8443 check resolvers docker init-addr libc,none
