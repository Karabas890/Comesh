name: veyra
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veyra
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra -d veyra"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    image: veyra-app:20261001
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://veyra:${POSTGRES_PASSWORD}@db:5432/veyra
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      COOKIE_SECURE: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2200}
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      private:
      proxy:
        aliases: [veyra-app]
    mem_limit: 1536m
    cpus: 1.5
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  gateway:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    user: "99:99"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [proxy]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      app:
        condition: service_healthy
  seed:
    image: veyra-app:20261001
    profiles: [setup]
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgresql://veyra:${POSTGRES_PASSWORD}@db:5432/veyra
      NODE_ENV: production
      ALLOW_DEMO_SEED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set a private demo password}
    networks: [private]
    depends_on:
      db:
        condition: service_healthy
networks:
  private:
    internal: true
  proxy:
    external: true
    name: veyra_proxy
volumes:
  postgres_data:
